<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarthak Graduation | Crafteako</title>

  <!-- your main styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/graduation-1.css">
  <!-- lightbox CSS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css"
  />
</head>
<body>
  <!-- Theme toggle -->
  <button id="theme-toggle" aria-label="Toggle light/dark mode" class="theme-toggle">
    🌓
  </button>

  <!-- Full‐Screen Hero -->
  <header
    class="hero-full"
    style="background-image: url('../assets/images/Sarthak/sarthak-cover.jpg')"
  >
    <div class="hero-text">
      <h1>Sarthak</h1>
      <p>Graduation Ceremony 2025</p>
      <a href="#albums" class="down-arrow">⌄</a>
    </div>
    <a href="#albums" class="down-arrow"></a>
  </header>

  <!-- Mini‐Gallery Section -->
  <section id="albums" class="mini-gallery">
    <a href="../assets/images/Sarthak/sarthak-1.jpg" data-lightbox="sarthak" data-title="Sarthak 1">
      <img src="../assets/images/Sarthak/sarthak-1.jpg" alt="Sarthak 1">
    </a>
  </section>

  <!-- lightbox JS -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox-plus-jquery.min.js"
  ></script>

  <!-- theme toggle script -->
  <script>
    (function() {
      const btn = document.getElementById('theme-toggle');
      const root = document.documentElement;
      // apply saved theme on load
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') root.setAttribute('data-theme', 'dark');

      btn.addEventListener('click', () => {
        const isDark = root.getAttribute('data-theme') === 'dark';
        root.setAttribute('data-theme', isDark ? '' : 'dark');
        localStorage.setItem('theme', isDark ? '' : 'dark');
      });
    })();
  </script>
</body>
</html>
